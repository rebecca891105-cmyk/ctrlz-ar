<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CTRL+Z｜如果人生可以重選</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
:root{color-scheme:dark;--bg:#0c1023;--glass:rgba(11,17,39,.9);--cyan:#72e8f4;--purple:#b9a1ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;background:var(--bg);color:white}#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 30%,#25316a,#0b1024 70%)}.scene{position:absolute;inset:0}.scene a-scene{width:100%;height:100%}.overlay{position:absolute;z-index:5;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px)}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:19px;font-weight:900;letter-spacing:.12em}.pill{border:1px solid #ffffff55;border-radius:999px;background:#0c1029b8;padding:8px 12px;font-size:12px}.panel{pointer-events:auto;background:var(--glass);border:1px solid #91a1e16b;box-shadow:0 12px 50px #0009;backdrop-filter:blur(15px);border-radius:20px;padding:20px;max-width:520px;width:100%;margin:0 auto}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:.15em;font-weight:700}.panel h1{font-size:23px;line-height:1.4;margin:9px 0}.panel p{line-height:1.75;color:#e1e5fb;margin:10px 0 16px;font-size:15px}.buttons{display:grid;gap:10px}button{border:0;border-radius:13px;padding:15px 14px;font-size:15px;font-weight:750;cursor:pointer;color:#10142d;background:var(--cyan)}button.secondary{background:#ffffff1b;color:white;border:1px solid #ffffff66}button:focus-visible{outline:3px solid white;outline-offset:2px}.small{font-size:12px;color:#b8c2e7}.hidden{display:none!important}.demoVisual{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.orb{width:min(57vw,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffffffbb,#76e8f480 20%,#7a5aff88 50%,#151b5500 72%);filter:drop-shadow(0 0 55px #85adff);animation:float 4s ease-in-out infinite alternate}.orb:after{content:'CTRL+Z';position:absolute;top:45%;left:0;right:0;text-align:center;font-size:25px;font-weight:900;letter-spacing:.15em;text-shadow:0 3px 16px #000}@keyframes float{to{transform:translateY(-24px) rotate(6deg)}}.modebar{position:absolute;z-index:10;top:65px;right:18px;pointer-events:auto;display:flex;gap:6px}.modebar button{font-size:12px;padding:9px 12px}.hint{position:absolute;z-index:4;top:22%;width:100%;text-align:center;padding:0 20px;color:#eef5ff;text-shadow:0 2px 8px #000}.hint span{display:inline-block;padding:10px 15px;background:#0b1026aa;border-radius:100px}.footer{text-align:center;font-size:11px;color:#c5c9e1;margin-top:12px}#error{position:absolute;top:110px;left:16px;right:16px;z-index:20;background:#52202de8;border-radius:12px;padding:12px;line-height:1.5;font-size:13px;display:none}
</style>
</head>
<body><main id="app">
<div id="demoVisual" class="demoVisual"><div class="orb"></div></div>
<div id="arScene" class="scene hidden">
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiScanning: no; uiError: yes" color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-assets></a-assets><a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0"><a-plane color="#263e80" opacity="0.35" width="1.12" height="0.66" position="0 0 0.02" material="side: double"></a-plane><a-ring color="#72e8f4" radius-inner="0.23" radius-outer="0.26" position="0 0 0.08" animation="property: rotation; to: 0 0 360; dur: 7000; loop: true; easing: linear"></a-ring><a-text value="CTRL+Z" align="center" color="#FFFFFF" width="2.5" position="0 0 0.1"></a-text></a-entity>
</a-scene></div>
<div class="hint" id="hint"><span>互動故事體驗｜試玩模式</span></div>
<div id="error" role="alert"></div>
<div class="modebar"><button id="demoBtn" class="secondary">試玩模式</button><button id="arBtn">開啟 AR</button></div>
<div class="overlay"><header><div class="brand">CTRL+Z <span style="font-size:10px;font-weight:400;letter-spacing:0">如果人生可以重選</span></div><div class="pill" id="status">● 試玩中</div></header>
<section class="panel" aria-live="polite"><div class="eyebrow" id="chapter">CHAPTER 01 · 人生的十字路口</div><h1 id="title">如果人生可以重選……</h1><p id="story">你收到一份外地工作的錄取通知，但家人希望你留在家鄉。這一次，你會如何選擇？</p><div class="buttons" id="choices"><button data-choice="leave">A｜離開家鄉，追求夢想</button><button data-choice="stay" class="secondary">B｜留在家鄉，陪伴家人</button></div><div class="footer">你的選擇沒有標準答案 · 每條路都有不同風景</div></section></div>
</main>
<script>
const $=id=>document.getElementById(id);let mode='demo',found=false;
const story={start:{chapter:'CHAPTER 01 · 人生的十字路口',title:'如果人生可以重選……',body:'你收到一份外地工作的錄取通知，但家人希望你留在家鄉。這一次，你會如何選擇？',options:[['leave','A｜離開家鄉，追求夢想'],['stay','B｜留在家鄉，陪伴家人']]},leave:{chapter:'ENDING A · 追夢之路',title:'你選擇了遠方',body:'你在陌生城市找到新的可能，也開始想念熟悉的家。你明白：勇敢向前，不代表不會遺憾。',options:[['start','↶ CTRL+Z｜重新選擇']]},stay:{chapter:'ENDING B · 熟悉的日常',title:'你選擇了留下',body:'你陪伴重要的人，生活逐漸安穩。但偶爾，你仍想起那座未曾抵達的城市。你明白：留下，也需要勇氣。',options:[['start','↶ CTRL+Z｜重新選擇']]}};
function render(key){const s=story[key];$('chapter').textContent=s.chapter;$('title').textContent=s.title;$('story').textContent=s.body;$('choices').replaceChildren(...s.options.map(([id,label],i)=>{let b=document.createElement('button');b.textContent=label;b.className=i?'secondary':'';b.addEventListener('click',()=>render(id));return b;}));}
const scene=document.querySelector('a-scene');const target=$('target');
target.addEventListener('targetFound',()=>{found=true;document.querySelector('.panel').classList.remove('hidden');$('status').textContent='● 已辨識海報';$('hint').classList.add('hidden');});
target.addEventListener('targetLost',()=>{found=false;document.querySelector('.panel').classList.add('hidden');$('status').textContent='● 尋找海報中';$('hint').classList.remove('hidden');});
function error(message){$('error').textContent=message;$('error').style.display='block';}
async function startAR(){if(mode==='ar')return;try{const check=await fetch('./targets.mind',{method:'HEAD'});if(!check.ok)throw Error('找不到 targets.mind。請先用 MindAR Compiler 將海報編譯成 targets.mind，並和 index.html 放在同一資料夾。');$('error').style.display='none';const system=scene.systems['mindar-image-system'];if(!system)throw Error('AR 程式庫未載入，請確認網路連線。');mode='ar';document.querySelector('.panel').classList.add('hidden');$('demoVisual').classList.add('hidden');$('arScene').classList.remove('hidden');$('hint').innerHTML='<span>請將相機對準辨識海報</span>';$('hint').classList.remove('hidden');$('status').textContent='● 啟動相機中';await system.start();$('status').textContent='● 尋找海報中';}catch(e){mode='demo';document.querySelector('.panel').classList.remove('hidden');$('arScene').classList.add('hidden');$('demoVisual').classList.remove('hidden');$('status').textContent='● 試玩中';error(e.message||'無法啟動 AR。請使用 HTTPS 網址並允許相機權限。');}}
async function startDemo(){if(mode==='ar'){try{await scene.systems['mindar-image-system'].stop();}catch(e){}}mode='demo';document.querySelector('.panel').classList.remove('hidden');$('arScene').classList.add('hidden');$('demoVisual').classList.remove('hidden');$('hint').innerHTML='<span>互動故事體驗｜試玩模式</span>';$('hint').classList.remove('hidden');$('status').textContent='● 試玩中';$('error').style.display='none';}
$('arBtn').addEventListener('click',startAR);$('demoBtn').addEventListener('click',startDemo);
</script></body></html>
