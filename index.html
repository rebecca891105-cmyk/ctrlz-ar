<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#090e21"><title>CTRL+Z｜人生分岔實驗室 AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
:root{--ink:#eaf5ff;--muted:#a6b9d5;--aqua:#72f2ef;--violet:#ad91ff;--bg:#090e21}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Noto Sans TC',sans-serif}button{font:inherit;cursor:pointer}#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1d2a5c 0%,#090e21 67%)}#arWrap{position:absolute;inset:0}#arWrap a-scene{width:100%;height:100%}.hidden{display:none!important}#demo{position:absolute;inset:0;pointer-events:none;overflow:hidden;background:linear-gradient(130deg,#111a39,#1c1840 55%,#09192d)}.gridbg{position:absolute;inset:-80%;background:linear-gradient(#7defff16 1px,transparent 1px),linear-gradient(90deg,#7defff16 1px,transparent 1px);background-size:58px 58px;transform:perspective(400px) rotateX(63deg);animation:drift 22s linear infinite}@keyframes drift{to{background-position:0 580px,580px 0}}.sphere{position:absolute;width:min(66vw,300px);aspect-ratio:1;left:50%;top:37%;transform:translate(-50%,-50%);border:2px solid #78e8ff88;border-radius:50%;box-shadow:0 0 60px #41d5ff66,inset 0 0 55px #a477ff66;animation:pulse 4s ease-in-out infinite}.sphere:before,.sphere:after{content:'';position:absolute;inset:12%;border:2px dashed #bba3ffb0;border-radius:50%;animation:spin 14s linear infinite}.sphere:after{inset:29%;border:3px solid #8cf8ffb0;animation-direction:reverse}.sphere b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(24px,7vw,38px);letter-spacing:.12em;text-shadow:0 0 24px #73f3ff}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{filter:hue-rotate(40deg);scale:1.07}}#ui{position:absolute;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 15px calc(env(safe-area-inset-bottom) + 14px)}.top{display:flex;align-items:center;justify-content:space-between;gap:9px}.logo{font-weight:900;letter-spacing:.14em;font-size:20px}.logo span{color:var(--aqua)}.topActions{display:flex;gap:6px}.chip,.mini{background:#09152bbf;border:1px solid #7ab9dc66;border-radius:100px;color:#e5f8ff;padding:9px 11px;font-size:12px;backdrop-filter:blur(8px);pointer-events:auto}.chip{font-size:11px}.spacer{flex:1}.card{width:min(100%,560px);margin:0 auto;pointer-events:auto;border-radius:22px;padding:19px;background:linear-gradient(135deg,#0a1830ed,#181733f0);border:1px solid #8bd6f16b;box-shadow:0 18px 70px #0009;backdrop-filter:blur(16px);max-height:min(75vh,720px);overflow:auto}.eyebrow{color:var(--aqua);font-size:11px;letter-spacing:.17em;font-weight:800}.card h1{font-size:clamp(21px,5vw,29px);line-height:1.4;margin:9px 0}.card p{color:#d6e2f7;line-height:1.8;font-size:14px;margin:9px 0 15px}.choices{display:grid;gap:9px}.action{width:100%;border-radius:13px;border:1px solid #72f2efaa;padding:13px 14px;text-align:left;background:linear-gradient(90deg,#73f1ed,#a8c7ff);color:#0b1630;font-weight:800}.action.secondary{background:#ffffff0b;color:#eef6ff;border-color:#ffffff55}.action:disabled{opacity:.45;cursor:not-allowed}.action:focus-visible,.mini:focus-visible{outline:3px solid #fff;outline-offset:2px}.status{font-size:12px;color:#b4c9e5;margin:11px 0 0}.bar{height:5px;background:#ffffff24;border-radius:5px;margin:10px 0 14px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#70f4e5,#b09dff);transition:width .3s}.trail{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tag{font-size:11px;border:1px solid #a4b9e066;border-radius:99px;padding:5px 9px;color:#d5eaff}.footer{text-align:center;color:#9db4d2;font-size:10px;margin-top:12px}#notice{position:absolute;top:80px;left:16px;right:16px;z-index:12;pointer-events:none;text-align:center}#notice span{display:inline-block;border:1px solid #7bd5ff80;background:#08152ee8;padding:9px 14px;border-radius:100px;font-size:12px}#error{display:none;position:absolute;z-index:20;top:120px;left:16px;right:16px;background:#501e2df2;border:1px solid #ff819e;border-radius:12px;padding:12px;line-height:1.6;font-size:13px}.info{color:#b9cbec;font-size:12px}.history{border-left:2px solid #72f2ef80;padding-left:12px;margin:10px 0;font-size:13px;line-height:1.8}.history strong{color:#72f2ef}#mode{white-space:nowrap}@media(max-height:690px){.card{padding:13px;max-height:73vh}.card p{margin:5px 0 9px}.action{padding:10px 12px}}
</style></head><body><main id="stage">
<div id="demo"><div class="gridbg"></div><div class="sphere"><b>CTRL+Z</b></div></div>
<div id="arWrap" class="hidden"><a-scene id="arScene" mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiScanning: no; uiError: yes; maxTrack: 1" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-torus id="ring" position="0 0 0.12" radius="0.42" radius-tubular="0.012" color="#78f4f2" rotation="20 0 0" animation="property: rotation; to: 20 360 0; loop: true; dur: 12000; easing: linear"></a-torus><a-torus radius="0.31" radius-tubular="0.009" color="#b9a3ff" position="0 0 0.15" rotation="70 0 0" animation="property: rotation; to: 70 -360 0; loop: true; dur: 16000; easing: linear"></a-torus><a-octahedron id="core" color="#7de7ff" metalness="0.4" roughness="0.15" radius="0.15" position="0 0 0.23" animation="property: rotation; to: 360 360 0; loop: true; dur: 10000; easing: linear"></a-octahedron><a-text value="CTRL+Z" color="#ffffff" align="center" width="2.3" position="0 -0.59 0.15"></a-text><a-entity position="0 0 0.1"><a-sphere radius="0.018" color="#fff" position="-0.45 0.34 0"></a-sphere><a-sphere radius="0.018" color="#fff" position="0.45 -0.33 0"></a-sphere></a-entity></a-entity></a-scene></div>
<div id="notice"><span id="noticeText">試玩模式｜不需要相機</span></div>
<div id="error" role="alert"></div>
<div id="ui"><div class="top"><div class="logo">CTRL<span>+Z</span></div><div class="topActions"><button class="mini" id="sound" aria-label="切換音效">音效：關</button><button class="mini" id="mode">啟動 AR</button></div></div><div class="spacer"></div><section class="card" aria-live="polite"><div class="eyebrow" id="chapter">INTERACTIVE LIFE / 00</div><div class="bar"><div id="progress" style="width:0%"></div></div><h1 id="title">如果人生可以重選</h1><p id="story"></p><div id="trail" class="trail"></div><div id="choices" class="choices"></div><div id="meta" class="status"></div><div class="footer">沒有完美人生，只有你願意繼續走下去的路。</div></section></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), nodes={chapter:$('chapter'),title:$('title'),story:$('story'),choices:$('choices'),trail:$('trail'),progress:$('progress'),meta:$('meta')};
const chapters=[
{title:'第一個岔路｜畢業之後',text:'你收到外地夢想工作的錄取通知，卻也有一份家鄉穩定的職缺。你會如何選擇？',options:[{label:'A｜前往陌生城市，追求夢想',value:'dream',name:'追逐夢想'},{label:'B｜留在家鄉，選擇穩定',value:'stable',name:'選擇穩定'}]},
{title:'第二個岔路｜重要的人',text:'一年後，你的生活逐漸忙碌。一位重要的朋友向你求助，但你正好有無法輕易放棄的安排。',options:[{label:'A｜放下安排，陪伴對方',value:'people',name:'珍惜關係'},{label:'B｜完成自己的目標，再好好聯絡',value:'goal',name:'堅持目標'}]},
{title:'第三個岔路｜重新開始',text:'你遇到挫折，原本的計畫不再順利。此刻，你最想對自己做什麼？',options:[{label:'A｜勇敢轉彎，嘗試新道路',value:'change',name:'勇敢改變'},{label:'B｜保留初心，調整腳步繼續',value:'persist',name:'持續前進'}]}
];
const endings={dream:'你走進陌生的城市，學會獨立，也經歷孤單。那些冒險讓你成長，卻不代表你從此不會後悔。',stable:'你留在熟悉的城市，擁有安穩的生活，也偶爾想起另一種可能。安定不是失敗，而是另一種勇敢。'};
let picks=[],step=-1,ar=false,tracked=false,soundOn=false,audio=null,busy=false;
function playTone(){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(560,audio.currentTime);o.frequency.exponentialRampToValueAtTime(850,audio.currentTime+.12);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}catch(e){}}
function btn(text,fn,secondary=false){const b=document.createElement('button');b.className='action'+(secondary?' secondary':'');b.textContent=text;b.addEventListener('click',()=>{playTone();fn()});nodes.choices.append(b)}
function render(){nodes.choices.replaceChildren();nodes.trail.replaceChildren();nodes.progress.style.width=(step<0?0:step>=3?100:(step+1)/4*100)+'%';nodes.chapter.textContent=step<0?'EXPERIMENT / START':step>=3?'EXPERIMENT / RESULT':`CHAPTER 0${step+1} / 03`;if(step===-1){nodes.title.textContent='如果人生可以重選';nodes.story.textContent='歡迎進入人生分岔實驗室。三次選擇，八種可能。你可以隨時按 CTRL+Z 回到上一個決定。這不是預測未來，而是一場關於選擇與理解的體驗。';btn('開始人生模擬',()=>{step=0;render()});btn('查看操作方式',()=>{nodes.story.textContent='試玩模式可直接操作劇情。AR 模式需要 HTTPS 網站、相機權限與同一張編譯海報的 targets.mind。將手機對準海報，出現立體光環後即可點選下方劇情選項。'},true);nodes.meta.textContent=ar?'AR 模式｜等待辨識海報':'試玩模式｜可直接體驗';return}
if(step<3){const c=chapters[step];nodes.title.textContent=c.title;nodes.story.textContent=c.text;for(const p of picks){const t=document.createElement('span');t.className='tag';t.textContent=p.name;nodes.trail.append(t)}c.options.forEach(o=>btn(o.label,()=>{picks.push(o);step++;render()}));btn('↶ CTRL+Z｜返回上一個選擇',undo,true);nodes.meta.textContent=`第 ${step+1} / 3 次選擇 · ${ar?(tracked?'海報已辨識':'請對準海報'):'試玩模式'}`;return}
const a=picks[0],b=picks[1],c=picks[2],profile=[a.value==='dream'?'探索者':'守護者',b.value==='people'?'連結者':'實踐者',c.value==='change'?'開拓者':'堅持者'].join('・');nodes.title.textContent='另一個自己｜'+profile;nodes.story.textContent=endings[a.value]+' '+(b.value==='people'?'你選擇陪伴重要的人，關係更深，也不得不放下部分計畫。':'你專注完成自己的計畫，取得進展，也開始思考如何修補疏遠的關係。')+' '+(c.value==='change'?'最後你轉換方向，遇見未曾想過的風景。':'最後你調整步伐，繼續守護最初的信念。')+' 每一條路都有收穫與遺憾，真正重要的是下一步。';picks.forEach(p=>{const t=document.createElement('span');t.className='tag';t.textContent=p.name;nodes.trail.append(t)});btn('↶ CTRL+Z｜修改最後一個選擇',undo);btn('重新開始｜體驗另一條人生',()=>{picks=[];step=0;render()},true);btn('複製我的人生路徑',()=>{const txt='CTRL+Z｜'+profile+'\n'+picks.map((p,i)=>`${i+1}. ${p.name}`).join('\n')+'\n沒有完美人生，只有下一步。';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>show('已複製人生路徑')).catch(()=>show('無法複製，請檢查瀏覽器權限'));else show('目前瀏覽器不支援複製')},true);nodes.meta.textContent='結局已解鎖｜八種分支組合之一';try{localStorage.setItem('ctrlz-last',JSON.stringify(picks.map(p=>p.name)))}catch(e){}
}
function undo(){if(step===-1)return;if(step===0){step=-1;picks=[]}else{step--;picks.pop()}render()}
function show(message){$('noticeText').textContent=message}
function err(message){$('error').textContent=message;$('error').style.display='block'}
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent='音效：'+(soundOn?'開':'關');playTone()});
$('mode').addEventListener('click',async()=>{if(busy)return;busy=true;$('error').style.display='none';if(ar){try{await $('arScene').systems['mindar-image-system'].stop()}catch(e){}ar=false;tracked=false;$('arWrap').classList.add('hidden');$('demo').classList.remove('hidden');$('mode').textContent='啟動 AR';show('試玩模式｜不需要相機');busy=false;render();return}
if(!window.isSecureContext){err('AR 相機需要 HTTPS 網址。請使用 GitHub Pages 網址開啟，不要直接開本機 HTML。');busy=false;return}
try{const response=await fetch('./targets.mind',{method:'GET',cache:'no-store'});if(!response.ok)throw Error('找不到 targets.mind（HTTP '+response.status+'）');const data=await response.arrayBuffer();if(data.byteLength<100)throw Error('targets.mind 檔案可能不完整')}catch(e){err('無法啟動 AR：'+e.message+'。請先把 MindAR 產生的 targets.mind 上傳到與 index.html 相同的 GitHub 資料夾。');busy=false;return}
$('arWrap').classList.remove('hidden');$('demo').classList.add('hidden');try{const scene=$('arScene');if(!scene.hasLoaded)await new Promise((resolve,reject)=>{scene.addEventListener('loaded',resolve,{once:true});setTimeout(()=>reject(Error('AR 元件載入逾時')),12000)});await scene.systems['mindar-image-system'].start();ar=true;$('mode').textContent='返回試玩';show('請將鏡頭對準 CTRL+Z 辨識海報');render()}catch(e){$('arWrap').classList.add('hidden');$('demo').classList.remove('hidden');err('相機啟動失敗：'+(e.message||'請允許相機權限，並確認手機瀏覽器支援 WebAR'));}finally{busy=false}});
$('target').addEventListener('targetFound',()=>{tracked=true;show('辨識成功｜點選下方劇情開始體驗');render()});$('target').addEventListener('targetLost',()=>{tracked=false;show('辨識暫停｜請再次對準海報');render()});render();
})();
</script></body></html>
